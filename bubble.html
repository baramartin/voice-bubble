<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: 'Segoe UI', sans-serif;
  }

  /* Pinned to the window's bottom edge (or top when the panel opens below), so the bubble
     stays put while the window grows to show the settings panel */
  .bubble-container {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 72px;
    padding: 4px;
    -webkit-app-region: drag;
  }

  .bubble {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(30, 30, 40, 0.92);
    backdrop-filter: blur(20px);
    border-radius: 36px;
    padding: 8px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 24px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08);
  }

  .bubble:hover {
    box-shadow: 0 6px 32px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.12);
  }

  .mic-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    -webkit-app-region: no-drag;
    position: relative;
    flex-shrink: 0;
  }

  .mic-btn.idle {
    background: linear-gradient(135deg, #667eea, #764ba2);
  }

  .mic-btn.idle:hover {
    background: linear-gradient(135deg, #7b8ff0, #8b5cb8);
    transform: scale(1.08);
  }

  .mic-btn.recording {
    background: #e74c3c;
    animation: pulse-rec 1.5s infinite;
  }

  .mic-btn.transcribing {
    background: #f39c12;
    cursor: wait;
  }

  .mic-btn.success {
    background: #27ae60;
  }

  .mic-btn.error {
    background: #e74c3c;
  }

  @keyframes pulse-rec {
    0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.5); }
    50% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
  }

  .mic-icon {
    width: 22px;
    height: 22px;
    fill: white;
  }

  .info-panel {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
    max-width: 0;
    opacity: 0;
    transition: max-width 0.3s ease, opacity 0.25s ease, padding 0.3s ease;
    padding-right: 0;
    white-space: nowrap;
  }

  .info-panel.visible {
    max-width: 180px;
    opacity: 1;
    padding-left: 10px;
    padding-right: 12px;
  }

  .info-label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .info-value {
    font-size: 16px;
    color: white;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .level-bar-container {
    height: 3px;
    width: 100%;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 2px;
  }

  .level-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4CAF50, #FFEB3B, #FF5722);
    border-radius: 2px;
    transition: width 0.08s ease;
  }

  /* Spinner for transcribing state */
  .spinner {
    width: 22px;
    height: 22px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .checkmark {
    font-size: 20px;
    color: white;
  }

  /* Settings gear button */
  .settings-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
  }

  .settings-btn:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.1);
  }

  .settings-btn.active {
    background: rgba(102, 126, 234, 0.4);
  }

  .settings-btn svg {
    width: 14px;
    height: 14px;
    fill: rgba(255,255,255,0.6);
    transition: fill 0.2s ease;
  }

  .settings-btn:hover svg, .settings-btn.active svg {
    fill: white;
  }

  /* Settings dropdown */
  .settings-panel {
    position: fixed;
    bottom: 76px;
    right: 4px;
    width: 360px;
    height: 400px;
    background: rgba(30, 30, 40, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
    -webkit-app-region: no-drag;
  }

  /* Near the top of the screen the window grows downward and the panel opens below the bubble */
  body.panel-below .bubble-container { top: 0; bottom: auto; }
  body.panel-below .settings-panel { top: 76px; bottom: auto; }

  .settings-panel.open {
    display: flex;
    animation: fade-in 0.15s ease;
  }

  .settings-tabs {
    display: flex;
    gap: 4px;
    padding: 8px 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .settings-tab {
    flex: 1;
    padding: 8px 6px 9px;
    border: none;
    background: none;
    color: rgba(255,255,255,0.5);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .settings-tab:hover { color: rgba(255,255,255,0.8); }

  .settings-tab.active {
    color: #fff;
    border-bottom-color: #667eea;
  }

  .settings-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0 8px;
  }

  .settings-hint {
    padding: 0 14px 6px;
    font-size: 11px;
    line-height: 1.4;
    color: rgba(255,255,255,0.4);
  }

  .voice-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 2px 10px 4px;
  }

  .voice-chip {
    padding: 6px 8px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    background: none;
    color: rgba(255,255,255,0.8);
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .voice-chip:hover { background: rgba(255,255,255,0.08); }

  .voice-chip.selected {
    border-color: #667eea;
    background: rgba(102, 126, 234, 0.15);
    color: #fff;
  }

  .voice-chip .voice-desc {
    display: block;
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .help-item {
    padding: 4px 14px;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(255,255,255,0.75);
  }

  .help-item kbd {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    font-family: inherit;
    font-size: 11px;
    color: #fff;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .settings-section-header {
    padding: 8px 14px 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.35);
  }

  .settings-divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 6px 0;
  }

  .settings-option {
    padding: 8px 14px;
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s ease;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }

  .settings-option:hover {
    background: rgba(255,255,255,0.08);
  }

  .settings-option.selected {
    color: #667eea;
  }

  .settings-option .check {
    width: 16px;
    flex-shrink: 0;
    align-self: flex-start;
    line-height: 17px;
    text-align: center;
    font-size: 12px;
  }

  .settings-option .option-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .settings-option .option-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .settings-option .option-desc {
    font-size: 11px;
    line-height: 1.35;
    color: rgba(255,255,255,0.4);
  }

  .style-badge {
    display: none;
    position: absolute;
    top: -2px;
    right: -2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #667eea;
  }

  .style-badge.active {
    display: block;
  }

  /* Speak-aloud button */
  .speak-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    -webkit-app-region: no-drag;
    flex-shrink: 0;
  }

  .speak-btn:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.1);
  }

  .speak-btn svg {
    width: 14px;
    height: 14px;
    fill: rgba(255,255,255,0.6);
    transition: fill 0.2s ease;
  }

  .speak-btn:hover svg {
    fill: white;
  }

  .speak-btn.loading {
    background: rgba(243, 156, 18, 0.4);
    cursor: wait;
  }

  .speak-btn.loading svg {
    fill: white;
  }

  .speak-btn.speaking {
    background: rgba(102, 126, 234, 0.5);
    animation: pulse-speak 1.5s infinite;
  }

  .speak-btn.speaking svg {
    fill: white;
  }

  @keyframes pulse-speak {
    0%, 100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4); }
    50% { box-shadow: 0 0 0 6px rgba(102, 126, 234, 0); }
  }

  .settings-panel::-webkit-scrollbar {
    width: 4px;
  }

  .settings-panel::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
  }
</style>
</head>

<script>
const FLASK_URL = 'http://localhost:5000';

const micBtn = document.getElementById('mic-btn');
const settingsBtn = document.getElementById('settings-btn');
const settingsPanel = document.getElementById('settings-panel');
const styleBadge = document.getElementById('style-badge');
const infoPanel = document.getElementById('info-panel');
const infoLabel = document.getElementById('info-label');
const infoValue = document.getElementById('info-value');
const levelBar = document.getElementById('level-bar');
const micIconSvg = document.getElementById('mic-icon-svg');
const spinner = document.getElementById('spinner');
const checkmark = document.getElementById('checkmark');

let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];
let startTime = null;
let timerInterval = null;
let audioContext = null;
let analyser = null;
let audioSource = null;
let levelInterval = null;
let selectedDeviceId = localStorage.getItem('selectedMicId') || null;
let selectedStyle = localStorage.getItem('selectedStyle') || 'clean';
let selectedSttEngine = localStorage.getItem('selectedSttEngine') || 'gemini-3.5-transcribe';
let providers = { openai: true, gemini: true }; // replaced by /config on startup
let pickerOpen = false;

const speakBtn = document.getElementById('speak-btn');
const speakIconSvg = document.getElementById('speak-icon-svg');
const stopIconSvg = document.getElementById('stop-icon-svg');

let isSpeaking = false;
let isLoadingTTS = false;
let ttsAudio = null;
let ttsStream = null; // active Gemini PCM playback { ctx }
let ttsAbort = null;
// Older versions saved 'gemini' / 'openai' here; 'gemini' gets replaced by the configured model in loadConfig
let selectedTtsEngine = localStorage.getItem('selectedTtsEngine') === 'openai'
  ? 'gpt-4o-mini-tts' : localStorage.getItem('selectedTtsEngine');
let selectedVoice = localStorage.getItem('selectedVoice') || 'alloy';
let selectedGeminiVoice = localStorage.getItem('selectedGeminiVoice') || 'Kore';
let selectedSpeechStyle = localStorage.getItem('selectedSpeechStyle') || 'none';

// 'clean' keeps its id so saved selections survive the rename to "Smart mode".
// With Gemini it uses Gemini's built-in smart transcription; with OpenAI the instruction below does the same job.
const STYLES = [
  { id: 'clean', label: 'Smart mode', geminiSmart: true,
    desc: 'Removes ums and false starts, keeps only your corrections ("Tuesday, no, Wednesday" becomes "Wednesday") and turns spoken lists into real lists.',
    instruction: 'Remove filler words (um, uh, like, you know), stutters and false starts. When the speaker corrects themselves (e.g. "Tuesday, actually no, Wednesday"), keep only the correction. Format spoken lists as lists. Fix grammar and punctuation. Keep the original meaning, tone and language.' },
  { id: 'none', label: 'Raw', desc: 'Exactly what you said, word for word, including ums.' },
  { id: 'no-newlines', label: 'No new lines', local: true, desc: 'Raw text joined into one line. Handy for chat boxes where Enter sends.' },

  { id: 'emojify', label: 'Emojify', desc: 'Your words, plus fitting emojis.',

  { id: 'concise', label: 'Make concise', desc: 'Shortened to the key points.',
    instruction: 'Shorten this text significantly while preserving the key meaning. Be direct and brief.' },
];

const VOICES = [
  { id: 'alloy', label: 'Alloy' },
  { id: 'ash', label: 'Ash' },
  { id: 'ballad', label: 'Ballad' },
  { id: 'cedar', label: 'Cedar' },
  { id: 'coral', label: 'Coral' },
  { id: 'echo', label: 'Echo' },
  { id: 'fable', label: 'Fable' },
  { id: 'marin', label: 'Marin' },
  { id: 'nova', label: 'Nova' },
  { id: 'onyx', label: 'Onyx' },
  { id: 'sage', label: 'Sage' },
  { id: 'shimmer', label: 'Shimmer' },
  { id: 'verse', label: 'Verse' },
];

const STT_ENGINES = [
  { id: 'gemini-3.5-transcribe', label: 'Gemini 3.5 Transcribe', provider: 'gemini' },
  { id: 'gpt-transcribe', label: 'OpenAI gpt-transcribe', provider: 'openai' },
  { id: 'gpt-4o-transcribe', label: 'OpenAI gpt-4o-transcribe', provider: 'openai' },

// The id is the model name sent to /tts
const TTS_ENGINES = [

function currentTtsEngine() {
  return TTS_ENGINES.find(e => e.id === selectedTtsEngine) || TTS_ENGINES.find(e => providers[e.provider]) || TTS_ENGINES[0];
}

// Voice characters as described in Google's docs
const GEMINI_VOICES = [

function applyLocalStyle(text, styleId) {
  switch (styleId) {
    case 'no-newlines':
      return text.replace(/\s*\n\s*/g, ' ').replace(/\s{2,}/g, ' ').trim();
    default:
      return text;
  }
}

// Notification sounds via AudioContext
// We keep a persistent context and must await resume() before scheduling tones,
// because Electron may suspend it until a user gesture has occurred.
let toneCtx = null;

async function playTone(freq, duration, type = 'sine', volume = 0.4) {
  if (!toneCtx || toneCtx.state === 'closed') toneCtx = new AudioContext();
  if (toneCtx.state === 'suspended') await toneCtx.resume();
  const osc = toneCtx.createOscillator();
  const gain = toneCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, toneCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, toneCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(toneCtx.destination);
  osc.start();
  osc.stop(toneCtx.currentTime + duration);
}

async function dingStart() {
  await playTone(880, 0.12);
  setTimeout(() => playTone(1175, 0.15), 80);
}

async function dongStop() {
  await playTone(785, 0.12);
  setTimeout(() => playTone(590, 0.18), 80);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function setState(state, message) {
  micBtn.className = `mic-btn ${state}`;
  micIconSvg.style.display = state === 'idle' || state === 'recording' ? '' : 'none';
  spinner.style.display = state === 'transcribing' ? '' : 'none';
  checkmark.style.display = state === 'success' ? '' : 'none';

  if (state === 'recording') {
    infoLabel.textContent = 'Recording';
    infoPanel.classList.add('visible');
  } else if (state === 'transcribing') {
    infoLabel.textContent = 'Transcribing';
    infoValue.textContent = message || '...';
    levelBar.style.width = '0%';
    infoPanel.classList.add('visible');
  } else if (state === 'success') {
    infoLabel.textContent = 'Done';
    infoValue.textContent = message || 'Pasted!';
    levelBar.style.width = '0%';
    infoPanel.classList.add('visible');
    setTimeout(() => setState('idle'), 2000);
  } else if (state === 'error') {
    infoLabel.textContent = 'Error';
    infoValue.textContent = message || 'Failed';
    levelBar.style.width = '0%';
    infoPanel.classList.add('visible');
    setTimeout(() => setState('idle'), 3000);
  } else {
    infoPanel.classList.remove('visible');
  }
}

async function enumerateMics() {
  const listMics = async () => (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  let mics = await listMics();
  // Device labels stay empty until mic access has been granted once; only then open a stream
  if (mics.length > 0 && !mics[0].label) {
    try {
      const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      tempStream.getTracks().forEach(t => t.stop());
      mics = await listMics();
    } catch (e) { /* permission denied - labels will be empty */ }
  }
  return mics;
}

async function startRecording() {
  if (isSpeaking || isLoadingTTS) stopSpeaking();
  if (pickerOpen) closePicker();
  try {
    const audioConstraints = {
      sampleRate: 44100,
      channelCount: 1,
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    };
    if (selectedDeviceId) {
      audioConstraints.deviceId = { exact: selectedDeviceId };
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: audioConstraints
    });

    audioChunks = [];
    isRecording = true;
    startTime = Date.now();

    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      isRecording = false;
      clearInterval(timerInterval);
      stopLevelMeter();
      stream.getTracks().forEach(t => t.stop());

      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      await transcribe(blob);
    };

    mediaRecorder.start();
    setState('recording');

    // Play start ding after recorder is running — getUserMedia on Windows
    // reconfigures the audio subsystem and kills playback in flight
    setTimeout(() => dingStart(), 150);

    timerInterval = setInterval(() => {
      infoValue.textContent = formatTime((Date.now() - startTime) / 1000);
    }, 200);

    startLevelMeter(stream);
  } catch (err) {
    console.error('Mic error:', err);
    setState('error', 'No mic');
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    dongStop();
    // Request a final data flush, then stop after a short delay
    // to ensure the last chunk of audio is captured
    if (mediaRecorder.state === 'recording') {
      mediaRecorder.requestData();
    }
    setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }, 300);
  }
}

let lastLevelValue = 0;

function startLevelMeter(stream) {
  try {
    audioContext = new AudioContext();
    audioSource = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.1;
    analyser.minDecibels = -65;
    analyser.maxDecibels = -15;
    audioSource.connect(analyser);
    lastLevelValue = 0;

    const timeArray = new Uint8Array(analyser.fftSize);
    const freqArray = new Uint8Array(analyser.frequencyBinCount);

    levelInterval = setInterval(() => {
      analyser.getByteTimeDomainData(timeArray);
      analyser.getByteFrequencyData(freqArray);

      // RMS from time domain — reliable volume indicator
      let rms = 0;
      for (let i = 0; i < timeArray.length; i++) {
        const amp = (timeArray[i] - 128) / 128;
        rms += amp * amp;
      }
      rms = Math.sqrt(rms / timeArray.length);

      // Frequency average weighted toward speech range (bins ~5-40 out of 512)
      let speechSum = 0;
      const speechBins = Math.min(freqArray.length, 60);
      for (let i = 3; i < speechBins; i++) {
        speechSum += freqArray[i];
      }
      const speechAvg = speechSum / (speechBins - 3);

      const combined = rms * 0.6 + (speechAvg / 255) * 0.4;

      // Noise gate
      if (combined < 0.008) {
        lastLevelValue *= 0.85;
      } else {
        const scaled = Math.min(100, Math.pow(combined * 10, 0.4) * 100);
        lastLevelValue = lastLevelValue * 0.6 + scaled * 0.4;
      }

      levelBar.style.width = `${Math.max(0, lastLevelValue)}%`;
    }, 50);
  } catch (e) {
    console.error('Level meter error:', e);
  }
}

function stopLevelMeter() {
  clearInterval(levelInterval);
  if (audioSource) audioSource.disconnect();
  if (audioContext && audioContext.state !== 'closed') audioContext.close();
  audioContext = null;
  analyser = null;
  audioSource = null;
  levelBar.style.width = '0%';
}

async function fetchWithRetry(url, options, maxRetries = 3) {
  for (let attempt = 1; attempt <= maxRetries; attempt++) {
    try {
      const resp = await fetch(url, options);
      if (resp.ok) return resp;
      if (resp.status >= 400 && resp.status < 500) throw new Error(`HTTP ${resp.status}`);
      throw new Error(`HTTP ${resp.status}`);
    } catch (err) {
      if (attempt === maxRetries) throw err;
      setState('transcribing', `Retry ${attempt}/${maxRetries - 1}...`);
      await new Promise(r => setTimeout(r, 1000 * attempt));
    }
  }
}

async function transcribe(blob) {
  setState('transcribing', 'Transcribing...');

  try {
    const engine = STT_ENGINES.find(e => e.id === selectedSttEngine) || STT_ENGINES[0];
    const style = STYLES.find(s => s.id === selectedStyle);
    // Gemini's smart mode does the cleanup itself, so we can skip the extra /transform round-trip
    const useSmart = engine.provider === 'gemini' && style?.geminiSmart;

    const formData = new FormData();
    formData.append('audio', blob, 'recording.webm');
    formData.append('model', engine.id);
    formData.append('provider', engine.provider);
    formData.append('mode', useSmart ? 'smart' : 'verbatim');
    formData.append('style', '');

    const resp = await fetchWithRetry(`${FLASK_URL}/transcribe`, {
      method: 'POST',
      body: formData
    });

    const result = await resp.json();
    if (!result.success || !result.text) {
      throw new Error(result.error || 'No text returned');
    }

    let finalText = result.text;

    if (style && style.local) {
      finalText = applyLocalStyle(finalText, style.id);
    } else if (style && style.instruction && !useSmart) {
      setState('transcribing', 'Styling...');

      const transformResp = await fetchWithRetry(`${FLASK_URL}/transform`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: finalText,
          style: selectedStyle,
          instruction: style.instruction
        })
      });

      const transformResult = await transformResp.json();
      if (transformResult.success && transformResult.transformed_text) {
        finalText = transformResult.transformed_text;
      }
    }

    const pasted = await window.electronAPI.transcriptionComplete(finalText);
    setState('success', pasted ? truncate(finalText, 25) : 'Copied, paste it');
  } catch (err) {
    console.error('Transcription error:', err);
    setState('error', 'API error');
  }
}

function truncate(str, len) {
  return str.length > len ? str.slice(0, len) + '...' : str;
}

// ---- Text-to-Speech ----

function setSpeakState(state) {
  speakBtn.className = `speak-btn ${state}`;
  speakIconSvg.style.display = state === 'speaking' ? 'none' : '';
  stopIconSvg.style.display = state === 'speaking' ? '' : 'none';
}

async function speakText(text, voiceOverride) {
  if (isRecording) return;

  if (!text || !text.trim()) {
    infoLabel.textContent = 'Error';
    infoValue.textContent = 'Empty clipboard';
    infoPanel.classList.add('visible');
    setTimeout(() => { if (!isSpeaking && !isLoadingTTS) infoPanel.classList.remove('visible'); }, 2000);
    return;
  }

  isSpeaking = true;
  isLoadingTTS = true;
  setSpeakState('loading');
  infoLabel.textContent = 'Loading TTS';
  infoValue.textContent = truncate(text.trim(), 25);
  infoPanel.classList.add('visible');

  try {
    const speechStyle = SPEECH_STYLES.find(s => s.id === selectedSpeechStyle);
    const instruction = speechStyle?.instruction || '';

    const engine = currentTtsEngine();
    ttsAbort = new AbortController();
    const resp = await fetch(`${FLASK_URL}/tts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text.trim(), voice: voiceOverride || currentTtsVoice(), instruction,
        provider: engine.provider, model: engine.id
      }),
      signal: ttsAbort.signal
    });

    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.error || `HTTP ${resp.status}`);
    }
    if (!isSpeaking) return; // cancelled during fetch

    if (engine.provider === 'gemini') {
      await playPcmStream(resp);
      return;
    }

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);

    ttsAudio = new Audio(url);
    ttsAudio.onended = () => { URL.revokeObjectURL(url); finishSpeaking(); };
    ttsAudio.onerror = () => {
      URL.revokeObjectURL(url);
      finishSpeaking();
      infoLabel.textContent = 'Error';
      infoValue.textContent = 'Audio error';
      infoPanel.classList.add('visible');
      setTimeout(() => { if (!isSpeaking) infoPanel.classList.remove('visible'); }, 2000);
    };

    isLoadingTTS = false;
    if (!isSpeaking) { URL.revokeObjectURL(url); return; } // cancelled during blob read

    setSpeakState('speaking');
    infoLabel.textContent = 'Speaking';
    await ttsAudio.play();
  } catch (err) {
    if (err.name === 'AbortError') return; // user stopped
    console.error('TTS error:', err);
    closeTtsStream();
    finishSpeaking();
    infoLabel.textContent = 'TTS failed';
    infoValue.textContent = truncate(err.message || 'Unknown error', 25);
    infoPanel.classList.add('visible');
    setTimeout(() => { if (!isSpeaking) infoPanel.classList.remove('visible'); }, 2000);
  }
}

// Plays streamed raw PCM (16-bit LE mono) as chunks arrive, scheduling them back-to-back
async function playPcmStream(resp) {
  const sampleRate = Number(resp.headers.get('X-Sample-Rate')) || 24000;
  const ctx = new AudioContext({ sampleRate });
  if (ctx.state === 'suspended') await ctx.resume();
  const stream = { ctx };
  ttsStream = stream;

  const reader = resp.body.getReader();
  const PREBUFFER = 0.1; // seconds of headroom before the first chunk plays
  let nextTime = 0;
  let started = false;
  let leftover = null; // odd trailing byte split across network chunks

  while (true) {
    const { done, value } = await reader.read();
    if (ttsStream !== stream) return; // stopped meanwhile
    if (done) break;

    let bytes = value;
    if (leftover) {
      bytes = new Uint8Array(leftover.length + value.length);
      bytes.set(leftover);
      bytes.set(value, leftover.length);
    }
    const usable = bytes.length - (bytes.length % 2);
    leftover = usable < bytes.length ? bytes.slice(usable) : null;
    if (!usable) continue;

    const samples = new Int16Array(bytes.slice(0, usable).buffer);
    const buffer = ctx.createBuffer(1, samples.length, sampleRate);
    const channel = buffer.getChannelData(0);
    for (let i = 0; i < samples.length; i++) channel[i] = samples[i] / 32768;

    if (!started) {
      started = true;
      isLoadingTTS = false;
      setSpeakState('speaking');
      infoLabel.textContent = 'Speaking';
      nextTime = ctx.currentTime + PREBUFFER;
    }

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    nextTime = Math.max(nextTime, ctx.currentTime); // if the network fell behind, resume immediately
    src.start(nextTime);
    nextTime += buffer.duration;
  }

  if (!started) throw new Error('No audio received');

  // Stream finished downloading; wait for the scheduled audio to play out. ctx.currentTime runs ahead
  // of what's audible by the output latency, so add that plus a margin or the last word gets clipped.
  const latency = (ctx.baseLatency || 0) + (ctx.outputLatency || 0);
  const remainingMs = (Math.max(0, nextTime - ctx.currentTime) + latency) * 1000;
  setTimeout(() => {
    if (ttsStream !== stream) return;
    closeTtsStream();
    finishSpeaking();
  }, remainingMs + 300);
}

function closeTtsStream() {
  if (ttsAbort) { ttsAbort.abort(); ttsAbort = null; }
  if (ttsStream) { ttsStream.ctx.close(); ttsStream = null; }
}

function stopSpeaking() {
  isSpeaking = false;
  isLoadingTTS = false;
  closeTtsStream();
  if (ttsAudio) {
    ttsAudio.pause();
    ttsAudio.currentTime = 0;
    ttsAudio = null;
  }
  setSpeakState('idle');
  infoPanel.classList.remove('visible');
}

function finishSpeaking() {
  isSpeaking = false;
  isLoadingTTS = false;
  setSpeakState('idle');
  infoPanel.classList.remove('visible');
}

// Load which providers have API keys, plus the defaults from the setup wizard. Saved choices win over defaults.
async function loadConfig() {
  // Flask starts alongside the bubble, so keep retrying for a while
  for (let attempt = 0; attempt < 60; attempt++) {
    try {
      const config = await (await fetch(`${FLASK_URL}/config`)).json();
      providers = config.providers;
      const d = config.defaults;
      if (!localStorage.getItem('selectedStyle') && STYLES.some(s => s.id === d.style)) {
        selectedStyle = d.style;
        updateStyleBadge();
      }
      if (!localStorage.getItem('selectedSttEngine')) selectedSttEngine = d.stt_engine;
      if (!TTS_ENGINES.some(e => e.id === selectedTtsEngine)) selectedTtsEngine = d.tts_engine;
      const defaultTtsProvider = TTS_ENGINES.find(e => e.id === d.tts_engine)?.provider;
      if (defaultTtsProvider === 'gemini' && !localStorage.getItem('selectedGeminiVoice')) selectedGeminiVoice = d.tts_voice;
      if (defaultTtsProvider === 'openai' && !localStorage.getItem('selectedVoice')) selectedVoice = d.tts_voice;

      // A saved choice may point at a provider whose key was removed since
      const sttEngine = STT_ENGINES.find(e => e.id === selectedSttEngine);
      if (!sttEngine || !providers[sttEngine.provider]) {
        selectedSttEngine = (STT_ENGINES.find(e => providers[e.provider]) || STT_ENGINES[0]).id;
      }
      const ttsEngine = TTS_ENGINES.find(e => e.id === selectedTtsEngine);
      if (!ttsEngine || !providers[ttsEngine.provider]) {
        selectedTtsEngine = (TTS_ENGINES.find(e => providers[e.provider]) || TTS_ENGINES[0]).id;
      }

      // Settings opened before the config arrived show every engine; redraw with the real list
      if (pickerOpen) renderSettingsPanel();
      return;
    } catch {
      await new Promise(r => setTimeout(r, 500));
    }
  }
}

// The dot on the settings button warns that your words will be rewritten or reformatted.
// Smart mode (the default) and Raw don't get one; the tooltip always names the current style.
function updateStyleBadge() {
  const style = STYLES.find(s => s.id === selectedStyle);
  styleBadge.classList.toggle('active', !['clean', 'none'].includes(selectedStyle));
  settingsBtn.title = `Settings (style: ${style ? style.label : 'Raw'})`;
}

// Hotkeys as configured in .env (defaults until main answers)
let hotkeys = { dictate: 'Ctrl+Shift+Space', readAloud: 'Ctrl+Alt+Shift+Space', failed: [] };

function kbd(accelerator) {
  return accelerator.split('+').map(key => `<kbd>${key}</kbd>`).join(' ');
}

// Show the hotkeys in the tooltips, and warn if another app already owns one instead of failing silently
async function loadHotkeys() {
  hotkeys = await window.electronAPI.getHotkeys();
  micBtn.title = `Click to record (${hotkeys.dictate})`;
  speakBtn.title = `Read the clipboard aloud (select text and press ${hotkeys.readAloud} to read a selection)`;
  const taken = hotkeys.failed;
  if (!taken.length) return;
  infoLabel.textContent = 'Hotkey in use'; // by another app; longer labels get cut off
  infoValue.title = 'Another app already uses this shortcut, so Voice Bubble could not register it.';
  infoValue.textContent = taken.join(', ');
  infoPanel.classList.add('visible');
  setTimeout(() => { if (!isRecording && !isSpeaking && !isLoadingTTS) infoPanel.classList.remove('visible'); }, 8000);
}

// Init: style badge, pre-enumerate mics, then load provider info and defaults
updateStyleBadge();
enumerateMics();
loadConfig();
loadHotkeys();
</script>
